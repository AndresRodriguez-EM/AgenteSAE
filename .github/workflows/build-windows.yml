name: Build Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install pyinstaller pyside6 python-docx lxml
      - name: Ejecutable portable (onefile)
        run: pyinstaller --noconfirm --onefile --windowed --name AgenteSAE --distpath dist_portable app.py
      - name: Aplicacion (carpeta, para instalador)
        run: pyinstaller --noconfirm --windowed --name AgenteSAE --distpath dist_app app.py
      - name: Instalador con Inno Setup
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: AgenteSAE-windows
          path: |
            dist_portable/AgenteSAE.exe
            Output/AgenteSAE-Setup.exe
